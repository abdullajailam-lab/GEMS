function parseDelimitedLine(line, sep) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (ch === sep && !q) { out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
async function fileRows(f) {
  const n = (f.name || '').toLowerCase();
  if (n.endsWith('.xls')) throw new Error('old-xls');
  const buf = await f.arrayBuffer();
  const head = new Uint8Array(buf, 0, 2);
  if (head[0] === 0x50 && head[1] === 0x4B) return firstSheetRows(await unzipEntries(buf));   // .xlsx is a zipped file
  const text = new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) throw new Error('empty');
  const first = lines[0];
  const seps = [',', ';', '\t'];
  const sep = seps.sort((a, b) => first.split(b).length - first.split(a).length)[0];
  return lines.map(l => parseDelimitedLine(l, sep));
}
function fileErr(e) {
  if (e && e.message === 'old-xls') return 'This is an old .xls file. Open it and save as .xlsx or .csv, then choose it again.';
  if (e && e.message === 'empty') return 'The file is empty.';
  return 'Could not read that file. Save it as .xlsx or .csv (Excel: File → Save As → CSV) and try again.';
}

/* ==================== Word (.docx) import: reads the first table (or the lines) of the document ==================== */
function wordRows(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const paraText = p => Array.from(p.getElementsByTagName('w:t')).map(t => t.textContent).join('');
  const tables = Array.from(doc.getElementsByTagName('w:tbl'));
  if (tables.length) {
    return Array.from(tables[0].getElementsByTagName('w:tr')).map(tr =>
      Array.from(tr.getElementsByTagName('w:tc')).map(tc =>
        Array.from(tc.getElementsByTagName('w:p')).map(paraText).join(' ').trim()));
  }
  return Array.from(doc.getElementsByTagName('w:p')).map(paraText).map(t => t.trim()).filter(Boolean).map(line => {
    const sep = line.indexOf('\t') >= 0 ? '\t' : (line.indexOf(';') >= 0 ? ';' : ',');
    return parseDelimitedLine(line, sep);
  });
}
const prevFileRows = fileRows;
fileRows = async function (f) {
  const n = (f.name || '').toLowerCase();
  if (n.endsWith('.docx')) {
    const files = await unzipEntries(await f.arrayBuffer());
    if (!files['word/document.xml']) throw new Error('not a word document');
    const rows = wordRows(files['word/document.xml']).filter(r => r.some(c => String(c || '').trim()));
    if (!rows.length) throw new Error('empty');
    return rows;
  }
  return prevFileRows(f);
};
function fileErr(e) {
  if (e && e.message === 'old-xls') return 'This is an old .xls file. Open it and save as .xlsx or .csv, then choose it again.';
  if (e && e.message === 'empty') return 'The file is empty.';
  if (e && e.message === 'not a word document') return 'This Word file could not be read. Save it as .docx, or copy the list into Excel and save as .xlsx.';
  return 'Could not read that file. Save it as .xlsx, .csv or .docx and try again.';
}

/* ==================== Timetable in the same format as the file: teachers, periods and names per cell; cells stay editable ==================== */
function levenshtein(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const normTeacher = v => String(v || '').toLowerCase().replace(/\b(miss|sir|mrs|mr|ms|ustaz|ustazaa|ustaadh)\b/g, '').replace(/[^a-z]/g, '');
function teacherByHeader(h) {
  if (!h) return null;
  const exact = DB.teachers.find(t => normName(t.name) === normName(h));
  if (exact) return exact;
  const k = normTeacher(h); if (!k) return null;
  let best = null, bd = 99;
  DB.teachers.forEach(t => { const d = levenshtein(k, normTeacher(t.name)); if (d < bd) { bd = d; best = t; } });
  // short names must match exactly, so that e.g. 'Saha' and 'Sama' stay two teachers
  const limit = k.length >= 6 ? 1 : 0;
  return bd <= limit ? best : null;
}
/* Names in a cell: "Maan (LKG D) / Arushal (5A)" or "Raamin (3B) Mufthee (3B)" */
function extractNames(text) {
  const out = []; const src = String(text || '');
  const rest = src.replace(/([^()\/\n,;]+?)\s*\(([^)]*)\)/g, (m, n) => { const nm = n.trim(); if (nm) out.push(nm); return ' '; });
  rest.split(/[\/\n,;]+/).map(x => x.trim()).filter(x => x.length > 1 && !/home school/i.test(x)).forEach(x => out.push(x));
  return out.map(x => x.replace(/^[A-Za-z]\.\s*/, '').trim()).filter(Boolean);
}
function findStudentByName(name) {
  const k = normName(name);
  return DB.students.find(s => normName(s.name) === k)
    || DB.students.find(s => normName(s.name).startsWith(k + ' '))
    || DB.students.find(s => { const last = k.split(' ').pop(); return last.length > 2 && normName(s.name).split(' ').pop() === last; });
}
function timetableMatches() {
  const T = ttTeach(); const out = [];
  Object.keys(T.cells || {}).forEach(k => {
    const [, c] = k.split('|').map(Number);
    const t = teacherForCol(c); if (!t) return;
    extractNames(T.cells[k]).forEach(name => out.push({ name, tid: t.id }));
  });
  return out;
}
ACT.ttDistribute = () => {
  const hits = timetableMatches();
  let n = 0; const missing = new Set(), clash = new Set(), done = new Set();
  hits.forEach(h => {
    const st = findStudentByName(h.name);
    if (!st) { missing.add(h.name); return; }
    if (done.has(st.id)) { if (st.tch !== h.tid) clash.add(st.name); return; }
    done.add(st.id); st.tch = h.tid; n++;
  });
  save();
  toast('Distributed ' + n + ' students' + (missing.size ? ' · ' + missing.size + ' names not found' : '') + (clash.size ? ' · ' + clash.size + ' listed under two teachers (kept the first)' : ''));
  render();
};
/* Import: the file's teachers, periods and names. Teachers not in the app are added. */
CHANGE.ttImport = async el => {
  const f = el.files && el.files[0]; if (!f) return;
  toast('Reading ' + f.name + '…');
  try {
    const res = timetableFromRows(await fileRows(f));
    if (res.error) { toast(res.error); return; }
    const T = ttTeach();
    T.cols = res.cols; T.rows = res.rows; T.cells = res.cells;
    let added = 0;
    res.cols.forEach(h => { if (!teacherByHeader(h)) { DB.teachers.push({ id: uid(), name: h, role: 'Teacher' }); added++; } });
    save();
    toast('Timetable imported: ' + res.rows.length + ' periods, ' + res.cols.length + ' teachers' + (added ? ' (' + added + ' added)' : ''));
  } catch (e) { toast(fileErr(e)); }
  render();
};

/* ==================== Lesson plans: for a teacher's group (not one student); saved with the date; list grouped by date ==================== */
function vPlanNew() {
  const d = S.draft && S.draft.plan ? S.draft.plan : (S.draft = { plan: { cls: S.cls, subj: 'English', ind: '', min: 45, date: today(), tid: DB.teachers[0] ? DB.teachers[0].id : '' } }).plan;
  if (!d.tid && DB.teachers[0]) d.tid = DB.teachers[0].id;
  const opts = ['English', 'Mathematics', 'Dhivehi'].map(sub => {
    const items = [...IND, ...DB.custom].filter(x => x.subj === sub);
    return items.length ? `<optgroup label="${esc(sub)}">${items.map(x => `<option value="${x.id}" ${x.id === d.ind ? 'selected' : ''}>${esc(x.title || x.name || x.id)}</option>`).join('')}</optgroup>` : '';
  }).join('');
  const teachers = DB.teachers.length
    ? `<div class="chips" style="margin-top:6px">${DB.teachers.map(t => `<button class="chip ${t.id === d.tid ? 'on' : ''}" data-a="pnTid" data-v="${t.id}">${esc(t.name)}</button>`).join('')}</div>`
    : '<div class="sub">Add teachers first.</div>';
  const group = d.tid ? teacherStudents(d.tid).length : 0;
  return `<div class="between"><h1>New lesson plan</h1></div>
  <div class="card">
    <div class="f" style="margin-top:0">Teacher group</div>${teachers}
    <div class="sub" style="margin-top:6px">${group} student${group === 1 ? '' : 's'} in this group. One plan is made for the whole group.</div>
    <div class="f" style="margin-top:14px">Subject</div><div class="chips" style="margin-top:6px">${DB.subjects.map(s => `<button class="chip ${s === d.subj ? 'on' : ''}" data-a="pnSubj" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <label class="f">Indicator<select id="f_ind"><option value="">Choose an indicator</option>${opts}</select></label>
    <label class="f">Date (saved with the plan)<input id="f_pd" type="date" value="${d.date}"></label>
    <div class="f" style="margin-top:14px">Length</div><div class="seg" style="margin-top:6px">${[30, 45, 60].map(m => `<button class="${m === d.min ? 'on' : ''}" data-a="pnMin" data-v="${m}">${m} min</button>`).join('')}</div>
    <div style="margin-top:16px"><button class="btn full" data-a="pnCreate">Save lesson plan</button></div>
  </div>`;
}
function vPlans() {
  const list = DB.plans.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const dates = [...new Set(list.map(p => p.date))];
  const body = dates.length ? dates.map(dt => {
    const plans = list.filter(p => p.date === dt);
    const byTeacher = {};
    plans.forEach(p => { const k = p.tid ? (teacherName(p.tid) || 'Teacher') : (clsName(p.cls) || 'Group'); (byTeacher[k] = byTeacher[k] || []).push(p); });
    return `<div class="sec"><h3>${esc(fmtShort(dt))}</h3></div>` + Object.keys(byTeacher).map(k => `<div class="card" style="margin-bottom:10px"><div class="f" style="margin-top:0">${esc(k)}</div>${byTeacher[k].map(p => `<div class="li" data-a="stack" data-v="plan:${p.id}"><div class="av" style="background:linear-gradient(135deg,${subjColor(p.subj)},var(--navy))">${esc(initials(p.subj || 'L'))}</div><div class="grow"><b>${esc(p.title)}</b><div class="sub">${esc(p.subj || '')} · ${p.minutes} min</div></div>${ico('chev', 18)}</div>`).join('')}</div>`).join('');
  }).join('') : '<div class="card"><div class="empty">No lesson plans yet. Tap New plan.</div></div>';
  return `<div class="between"><h1>Lesson plans</h1><button class="btn sm" data-a="stack" data-v="planNew">${ico('plus', 18)}New plan</button></div>${body}`;
}
ACT.pnTid = d => { keepForm(); S.draft.plan.tid = d.v; render(); };
ACT.pnCreate = () => {
  keepForm();
  const p = S.draft && S.draft.plan;
  if (!p || !p.ind) return toast('Choose an indicator.');
  const cls = p.cls || (DB.classes[0] && DB.classes[0].id);
  const group = p.tid ? teacherStudents(p.tid) : studentsIn(cls);
  if (!group.length) return toast(p.tid ? 'This teacher has no students yet.' : 'This group has no students yet.');
  const pl = buildPlan(cls, p.subj, p.ind, p.min, p.date);
  if (p.tid) { pl.tid = p.tid; pl.title = (pl.title || 'Lesson plan') + ' · ' + (teacherName(p.tid) || 'Teacher'); }
  DB.plans.push(pl); save(); S.draft = null; S.stack.pop(); S.stack.push('plan:' + pl.id);
  burst(); toast('Lesson plan saved' + (p.tid ? ' for ' + (teacherName(p.tid) || 'the group') : '')); render();
};

/* ==================== Teacher timetable: the three tools in one tidy card at the top ==================== */
(function () {
  const prevTT = vTT;
  vTT = function () {
    let out = prevTT();
    if (S.ttView !== 'teacher') return out;
    out = out.replace(/<div class="row" style="margin:0 0 10px"><button class="btn sm" data-a="ttTDistribute">Distribute students to teachers<\/button><\/div>/g, '');
    out = out.replace(/<div class="row" style="margin:0 0 10px"><label class="btn ghost sm"[\s\S]*?Distribute students from timetable<\/button><\/div>/g, '');
    const tools = `<div class="card" style="padding:12px;margin-bottom:12px"><div class="f" style="margin-top:0">Timetable tools</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <button class="btn sm" data-a="ttTDistribute">Distribute students to teachers</button>
        <label class="btn ghost sm" style="cursor:pointer;text-align:center">Import timetable file<input type="file" accept="${FILE_ACCEPT}" data-a="ttImport" hidden></label>
        <button class="btn sm" style="grid-column:1 / span 2" data-a="ttDistribute">Distribute students from timetable</button>
      </div></div>`;
    const marker = '<div class="chips" style="margin-bottom:10px">';
    return out.includes(marker) ? out.replace(marker, tools + marker) : tools + out;
  };
})();

/* ==================== Header, bottom bar, render, start ==================== */
const NAV = [['home', 'Home', 'home'], ['students', 'Students', 'people'], ['attend', 'Attend', 'check'], ['tt', 'Timetable', 'grid'], ['more', 'More', 'dots']];
function renderTop() {
  const c = cur();
  const me = tchOf(DB.me), who = me ? me.name : 'GEMS';
  const dateLine = dOf(today()).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const title = c ? (TOP_TITLE[c.split(':')[0]] || TOP_TITLE2[c.split(':')[0]] || '') : (S.tab === 'home' ? greet(new Date().getHours()) : TAB_TITLE[S.tab]);
  const back = `<button class="hb" data-a="back" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC.back}</svg></button>`;
  $('#top').innerHTML = `<div class="tr">
      ${c ? back : `<div class="mk">${logoSVG(30, false, 'top')}</div>`}
      <div class="brandtxt"><div class="bn">${c ? esc(title) : 'GEMS'}</div></div>
      <button class="me" data-a="tab" data-v="more" aria-label="Account: ${esc(who)}">${esc(initials(who))}</button></div>
    <div class="ptitle"><div class="pdate">${esc(dateLine)}</div>${S.tab === 'home' && !c ? `<div class="pt">${esc(title)}</div>` : ''}</div>`;
}
function renderNav() {
  const cur2 = cur() ? (cur().split(':')[0]) : null;
  const moreSet = ['calendar', 'mark', 'plans', 'planNew', 'plan', 'reports', 'settings', 'evNew'];
  const active = S.tab === 'more' && !cur() ? 'more' : (cur() && moreSet.includes(cur2) && S.tab !== 'home' ? 'more' : S.tab);
  $('#nav').innerHTML = NAV.map(([k, l, i]) => `<button class="${active === k ? 'on' : ''}" data-a="tab" data-v="${k}" aria-label="${l}">${i === 'dots' ? '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>' : `<svg viewBox="0 0 24 24">${IC[i]}</svg>`}<span>${l}</span></button>`).join('');
}
function animateCounts() {
  document.querySelectorAll('.kpi b').forEach(el => {
    const end = parseInt(el.textContent, 10);
    if (isNaN(end) || el.textContent.trim() !== String(end)) return;
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 650); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render() {
  const openGp = !!(document.querySelector('details.gp') && document.querySelector('details.gp').open);
  renderTop(); renderNav();
  const m = $('#main');
  m.innerHTML = routeMain();
  if (openGp) { const g = document.querySelector('details.gp'); if (g) g.open = true; }
  if (page() === 'students' && !cur()) drawStList();
  animateCounts();
  const pg = document.querySelector('.kpi'); void pg;
}
function showErr(err) {
  const msg = (err && err.message) || 'Unknown error';
  let d = document.getElementById('gems-err');
  if (!d) { d = document.createElement('div'); d.id = 'gems-err'; d.style.cssText = 'position:fixed;inset:0;z-index:200;background:#F2F5FA;padding:28px 20px;overflow:auto;font-family:system-ui,sans-serif'; document.body.appendChild(d); }
  d.innerHTML = '<h2 style="margin:0 0 8px">Something went wrong</h2><p style="color:#5C6B88">Your saved data is safe. Tap Reload. If it happens again, send this message:</p><pre style="white-space:pre-wrap;background:#fff;border:1px solid #DCE4F1;border-radius:10px;padding:12px;font-size:13px"></pre><button onclick="location.reload()" style="background:#1F5BC4;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:800">Reload</button>';
  d.querySelector('pre').textContent = msg;
}
window.addEventListener('error', e => { const sp = document.getElementById('splash'); if (sp) sp.remove(); showErr(e.error || { message: e.message }); });
window.addEventListener('unhandledrejection', e => { showErr(e.reason || { message: 'Unhandled error' }); });

function boot() {
  DB.theme = 'blue';
  buildOpening();
  applyTheme(); setAppIcon(false);
  const sp = document.getElementById('splash');

  if (sp) for (let i = 0; i < 9; i++) {
    const d = document.createElement('span'); d.className = 'drift';
    d.style.left = (6 + Math.random() * 88) + '%'; d.style.top = (8 + Math.random() * 84) + '%';
    d.style.animationDelay = (Math.random() * 6).toFixed(2) + 's'; d.style.animationDuration = (5 + Math.random() * 4).toFixed(2) + 's';
    d.style.setProperty('--sz', (6 + Math.random() * 8).toFixed(1) + 'px'); sp.appendChild(d);
  }
  $('#splashLogo').innerHTML = logoSVG(136, true, 'sp');
  $('#splashWord').innerHTML = LOGO_WORD.split('').map((ch, i) => `<span style="--k:${i}">${ch}</span>`).join('');
  try { render(); } catch (e) { showErr(e); }
  setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 950); } }, 3300);
}
boot();
